kind = "mobile"
previewPath = "/"
title = "Solana Launch Lab"
description = "An Android-first Solana research and trading app, beginning with secure Phantom wallet connection and Devnet testing."
version = "1.0.0"
id = "artifacts/solana-launch-lab"
router = "expo-domain"

[[services]]
name = "expo"
ensurePreviewReachable = "/status"
paths = [ "/" ]
localPort = 20762

[services.development]
run = "pnpm --filter @workspace/solana-launch-lab run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/solana-launch-lab", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/solana-launch-lab", "run", "serve" ]

[services.env]
PORT = "20762"
BASE_PATH = "/"
